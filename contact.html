      <div class="hamburger"><span></span><span></span><span></span></div>

    <!-- CONTACT SECTION -->
    <main>
      <section class="contact-section">
        <h1 class="page-title">CONTACT ME</h1>
        <p class="page-subtitle">Let's connect</p>

        <div class="contact-layout">
          <!-- Contact Info -->

          <!-- Contact Image -->
          <div class="contact-image">
            <img
              src="contact image.jpeg"
              alt="Annie Thomas smiling in an office chair"
            />
          </div>
          <div class="contact-info">
            <h2>Get in touch</h2>
            <ul>
              <li><strong>Name:</strong> Annie Thomas</li>
              <li><strong>Email:</strong> thomasannie977@gmail.com</li>
              <li><strong>Phone:</strong> 0883796217</li>
              <li><strong>LinkedIn:</strong> linkedin.com/in/annie-thomas</li>
            </ul>
          </div>

          <!-- Contact Form -->
          <div class="contact-form-container">
            <form id="contact-form" novalidate>
              <div class="form-group">
                <label for="name">NAME:</label>
                <input type="text" id="name" placeholder="Your name" />
                <span class="error-message" id="name-error"></span>
              </div>

              <div class="form-group">
                <label for="email">EMAIL:</label>
                <input type="email" id="email" placeholder="your@email.com" />
                <span class="error-message" id="email-error"></span>
              </div>

              <div class="form-group">
                <label for="message">MESSAGE:</label>
                <textarea
                  id="message"
                  rows="5"
                  placeholder="Your message..."
                ></textarea>
                <span class="error-message" id="message-error"></span>
              </div>

              <button type="submit" class="btn btn-primary">
                SEND MESSAGE
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
